title: "Qiyan Ke"
description: "Qiyan Ke's academic homepage. Research in Reinforcement Learning and Dexterous Manipulation."
url: "https://kqy18.github.io"
baseurl: "/Homepage"
repository: "kqy18/Homepage"
lang: en
timezone: Asia/Shanghai
author:
  name: "Qiyan Ke"
  avatar: "/images/portrait.jpeg"
  bio: "Master’s Student"
  affiliation: "Tsinghua University"
  location: "Beijing, China"
  email: "kqy25@mails.tsinghua.edu.cn"
  github: "kqy18"
  googlescholar: ""
include: ["_pages"]
exclude: [".local", ".bundle", ".sites-runtime", ".github", "docs", "google_scholar_crawler", "Gemfile", "Gemfile.lock", "LICENSE", "README.md", "run_server.sh", "scripts", "node_modules", "vendor"]
markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
plugins:
  - jekyll-sitemap
  - jekyll-redirect-from
sass:
  sass_dir: _sass
  style: compressed
defaults:
