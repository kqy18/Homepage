  status: "Accepted at CoRL 2026"
  summary: "Grasp-conditioned dependency graphs model which objects obstruct a candidate grasp during approach and lifting. Trained on over 3.6 million labeled object–grasp edges across 500 scenes, a learned predictor estimates these dependencies. A short-prefix planner selects a grasp, removes predicted blockers, and replans after each intervention to reduce unnecessary object movements. We evaluate the framework through large-scale planning tests, closed-loop simulation, and hardware trials."
