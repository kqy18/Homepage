- venue: "Preprint"
  year: 2026
  title: "EAGG: Embodiment-Aligned Grasp Generation via Geometry-Aware Graph Conditioning"
  authors:
    - name: "Wanhao Niu"
    - name: "Qiyan Ke"
    - name: "Yuan Sun"
    - name: "Hao Sun"
    - name: "Jie Xu"
    - name: "Muyuan Ma"
    - name: "Ruiqi Hu"
    - name: "Fuchun Sun"
  status: "Under review · arXiv:2606.18092"
  summary: "EAGG unifies grasp generation across robotic hands and grippers using topology-aware embodiment graphs and compact control spaces. Iterative geometry conditioning tracks the articulated hand throughout sampling. The shared model approaches the performance of specialized models and transfers to new embodiments, with real-world validation on FreedomHand, Dahuan AG95, and SOARM101."
